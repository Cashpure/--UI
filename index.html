<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Интерфейс отдела продаж ЦентрКонсалт для просмотра заявок и управления блокировками устройств." />
    <title>Устройства и заявки — ЦентрКонсалт</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body data-theme="dark">
    <div class="app-shell">
      <div class="main-area">
        <header class="topbar">
          <div class="brand"><span class="brand-mark" aria-hidden="true">ЦК</span><span class="brand-copy"><strong>ЦентрКонсалт</strong><small>Отдел продаж</small></span></div>
          <div class="topbar-actions">
            <button id="resetChanges" class="text-button" type="button">Сбросить изменения</button>
            <button id="themeToggle" class="theme-button" type="button" aria-label="Включить светлую тему" aria-pressed="false">
              <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
              <span id="themeLabel">Светлая тема</span>
            </button>
          </div>
        </header>

        <main>
          <section id="devicesView" class="page-content" aria-labelledby="devicesTitle">
            <div class="page-heading">
              <div>
                <h1 id="devicesTitle">Контроль заявок</h1>
              </div>
            </div>

            <div class="workspace-grid">
              <section class="panel list-panel" aria-labelledby="listTitle">
                <div class="panel-heading">
                  <div><h2 id="listTitle">Список устройств</h2><p>Новые обращения находятся сверху</p></div>
                  <span id="resultCount" class="count-pill"></span>
                </div>
                <div class="list-toolbar">
                  <div class="filter-tabs" role="group" aria-label="Фильтр по статусу">
                    <button class="filter-tab is-active" type="button" data-filter="all" aria-pressed="true">Все</button>
                    <button class="filter-tab" type="button" data-filter="active" aria-pressed="false">Активные</button>
                    <button class="filter-tab" type="button" data-filter="blocked" aria-pressed="false">Заблокированные</button>
                  </div>
                  <label class="search-field">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.3 4.3"/></svg>
                    <input id="deviceSearch" type="search" autocomplete="off" placeholder="Телефон или слепок" aria-label="Поиск по телефону или слепку устройства" />
                  </label>
                </div>
                <div class="table-scroll">
                  <table class="device-table">
                    <thead><tr><th scope="col">Последнее обращение</th><th scope="col">Слепок устройства</th><th scope="col">Телефон</th><th scope="col">Заявок</th><th scope="col">Статус</th></tr></thead>
                    <tbody id="deviceRows"></tbody>
                  </table>
                </div>
                <div id="emptyState" class="empty-state" hidden><strong>Ничего не найдено</strong><span>Попробуйте другой телефон, слепок или фильтр.</span></div>
                <div class="table-footer">Нажмите на строку, чтобы посмотреть историю устройства</div>
              </section>

              <section class="panel detail-panel" id="deviceDetail" aria-label="Подробности устройства"></section>
            </div>
          </section>

        </main>
      </div>
    </div>

    <div id="modalBackdrop" class="modal-backdrop" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDescription">
        <div class="dialog-icon" id="modalIcon" aria-hidden="true"></div>
        <h2 id="modalTitle"></h2>
        <p id="modalDescription"></p>
        <form id="actionForm">
          <div id="reasonFields" class="reason-fields">
            <label for="blockReason">Причина блокировки</label>
            <select id="blockReason" name="reason">
              <option value="Частые повторные заявки">Частые повторные заявки</option>
              <option value="Некорректные контактные данные">Некорректные контактные данные</option>
              <option value="Другая причина">Другая причина</option>
            </select>
            <label for="reasonComment">Комментарий <span>(необязательно)</span></label>
            <textarea id="reasonComment" name="comment" rows="3" placeholder="Например, несколько одинаковых заявок за короткое время"></textarea>
          </div>
          <div class="dialog-actions"><button id="cancelAction" class="secondary-button" type="button">Отмена</button><button id="confirmAction" class="primary-button" type="submit"></button></div>
        </form>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
